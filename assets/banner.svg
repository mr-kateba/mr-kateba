<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="kateba - Blazma">
  <title>kateba · Blazma</title>
  <defs>
    <linearGradient id="blazma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB300"/><stop offset="1" stop-color="#FF3D00"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6D00" stop-opacity="0.55"/><stop offset="1" stop-color="#FF6D00" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E0E13"/><stop offset="1" stop-color="#191920"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB300" stop-opacity="0"/><stop offset="0.5" stop-color="#FFB300" stop-opacity="0.9"/><stop offset="1" stop-color="#FFB300" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="round"><rect width="900" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle cx="450.0" cy="98" r="120" fill="url(#halo)">
      <animate attributeName="r" values="105;130;105" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <rect y="297" width="260" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="-260;900;-260" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="19.5" fill="none" stroke="#2A2A34"/>
  <svg x="402.0" y="40" width="96" height="96" viewBox="0 0 100 100"><path d="M 50,3 L 91,26.5 L 91,73.5 L 50,97 L 9,73.5 L 9,26.5 Z" fill="url(#blazma)"/>
  <path d="M 57,14 L 27,55 L 46,55 L 40,86 L 73,43 L 54,43 L 61,14 Z" fill="#FFFFFF"/></svg>
  <g font-family="'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="450.0" y="186" font-size="46" font-weight="800" fill="#F5F5F7" letter-spacing="1">kateba</text>
    <text x="450.0" y="222" font-size="19" fill="#FFB300" direction="rtl">أدوات ويندوز عربية، مجانية ومفتوحة المصدر</text>
    <text x="450.0" y="252" font-size="15" fill="#9A9AA6">Free, open-source Windows tools with a native Arabic interface</text>
  </g>
